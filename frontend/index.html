<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Risk Assessment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Credit Risk Assessment</h1>

        <p>
            Enter the applicant's information to assess credit default risk.
        </p>

        <form id="credit-form">

            <h2>Personal Information</h2>

            <label for="person_age">Age</label>
            <input
                type="number"
                id="person_age"
                min="1"
                required
            >

            <label for="person_income">Annual Income</label>
            <input
                type="number"
                id="person_income"
                min="1"
                step="0.01"
                required
            >

            <label for="person_home_ownership">Home Ownership</label>
            <select id="person_home_ownership" required>
                <option value="RENT">Rent</option>
                <option value="OWN">Own</option>
                <option value="MORTGAGE">Mortgage</option>
                <option value="OTHER">Other</option>
            </select>

            <label for="person_emp_length">Employment Length (Years)</label>
            <input
                type="number"
                id="person_emp_length"
                min="0"
                step="0.1"
                required
            >


            <h2>Loan Information</h2>

            <label for="loan_intent">Loan Purpose</label>
            <select id="loan_intent" required>
                <option value="PERSONAL">Personal</option>
                <option value="EDUCATION">Education</option>
                <option value="MEDICAL">Medical</option>
                <option value="VENTURE">Business / Venture</option>
                <option value="HOMEIMPROVEMENT">Home Improvement</option>
                <option value="DEBTCONSOLIDATION">Debt Consolidation</option>
            </select>

            <label for="loan_grade">Loan Grade</label>
            <select id="loan_grade" required>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
            </select>

            <label for="loan_amnt">Loan Amount</label>
            <input
                type="number"
                id="loan_amnt"
                min="1"
                step="0.01"
                required
            >

            <label for="loan_int_rate">Interest Rate (%)</label>
            <input
                type="number"
                id="loan_int_rate"
                min="0"
                step="0.01"
                required
            >


            <h2>Credit History</h2>

            <label for="cb_person_default_on_file">
                Previous Default on File
            </label>

            <select id="cb_person_default_on_file" required>
                <option value="N">No</option>
                <option value="Y">Yes</option>
            </select>

            <label for="cb_person_cred_hist_length">
                Credit History Length (Years)
            </label>

            <input
                type="number"
                id="cb_person_cred_hist_length"
                min="0"
                required
            >


            <button type="submit">
                Analyze Risk
            </button>

        </form>


        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
